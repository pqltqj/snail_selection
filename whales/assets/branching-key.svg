<text x="1040" y="479" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Step 5</text>
<text x="1040" y="511" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Nose region / tusk</text>
