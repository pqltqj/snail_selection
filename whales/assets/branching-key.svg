<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
<title id="title">Whale classification key in branching form</title>
<desc id="desc">Start at Step 1. Baleen leads to Steps 2 and 3; teeth leads to Steps 4, 5 and 6. Every branch shows the statement and species endpoint.</desc>
<rect width="1700" height="1080" fill="#f2f7f8" />
<g fill="none" stroke="#416273" stroke-width="4" stroke-linejoin="round">
<path d="M800 112V173H370V210 M800 173H1180V210" />
<path d="M370 288V380H160V450 M370 380H570V450" />
<path d="M160 528V668H130V725 M160 668H410V725" />
<path d="M1180 288V380H1040V450 M1180 380H1500V450" />
<path d="M1040 528V657H930V725 M1040 657H1300V725" />
<path d="M930 803V969H815V1015 M930 969H1120V1015" />
</g>
<rect x="620.0" y="34" width="360" height="78" rx="12" fill="#e1edf0" stroke="#075c70" stroke-width="3" />
<text x="800" y="63" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Step 1</text>
<text x="800" y="95" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Mouth structures</text>
