<text x="370" y="239" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Step 2</text>
<text x="370" y="271" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Dorsal fin</text>
<rect x="1025.0" y="210" width="310" height="78" rx="12" fill="#e1edf0" stroke="#075c70" stroke-width="3" />
<text x="1180" y="239" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Step 4</text>
<text x="1180" y="271" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Dorsal fin</text>
<rect x="15.0" y="450" width="290" height="78" rx="12" fill="#e1edf0" stroke="#075c70" stroke-width="3" />
<text x="160" y="479" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Step 3</text>
<text x="160" y="511" text-anchor="middle" dominant-baseline="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Pectoral fins</text>
<rect x="420.0" y="450" width="300" height="60" rx="12" fill="#082f42" stroke="#075c70" stroke-width="3" />
<text x="570" y="488" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Bowhead whale</text>
