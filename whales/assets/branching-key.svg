<text x="1120" y="1053" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Beluga</text>
<rect x="234.0" y="121.0" width="272" height="36" fill="#f2f7f8" /><text x="370" y="150" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">1A. Baleen plates</text>
<rect x="1080.0" y="121.0" width="200" height="36" fill="#f2f7f8" /><text x="1180" y="150" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">1B. Teeth</text>
<rect x="53.0" y="298.0" width="224" height="36" fill="#f2f7f8" /><text x="165" y="327" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">2A. Dorsal fin</text>
<rect x="65.0" y="330.0" width="200" height="36" fill="#f2f7f8" /><text x="165" y="359" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">present</text>
<rect x="434.0" y="314.0" width="272" height="36" fill="#f2f7f8" /><text x="570" y="343" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">2B. No dorsal fin</text>
<rect x="904.0" y="314.0" width="272" height="36" fill="#f2f7f8" /><text x="1040" y="343" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">4A. No dorsal fin</text>
<rect x="1400.0" y="298.0" width="200" height="36" fill="#f2f7f8" /><text x="1500" y="327" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">4B. Large</text>
<rect x="1400.0" y="330.0" width="200" height="36" fill="#f2f7f8" /><text x="1500" y="359" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">dorsal fin</text>
<rect x="30.0" y="556.0" width="200" height="36" fill="#f2f7f8" /><text x="130" y="585" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">3A. Long</text>
<rect x="26.0" y="588.0" width="208" height="36" fill="#f2f7f8" /><text x="130" y="617" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">pectoral fins</text>
<rect x="310.0" y="556.0" width="200" height="36" fill="#f2f7f8" /><text x="410" y="585" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">3B. Short</text>
<rect x="306.0" y="588.0" width="208" height="36" fill="#f2f7f8" /><text x="410" y="617" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">pectoral fins</text>
<rect x="686.0" y="543.0" width="368" height="36" fill="#f2f7f8" /><text x="870" y="572" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">5A. Small nose, without</text>
<rect x="694.0" y="575.0" width="352" height="36" fill="#f2f7f8" /><text x="870" y="604" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">a long projecting tusk</text>
<rect x="1123.0" y="536.0" width="384" height="36" fill="#f2f7f8" /><text x="1315" y="565" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">5B. Long projection from</text>
<rect x="1187.0" y="568.0" width="256" height="36" fill="#f2f7f8" /><text x="1315" y="597" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">the nose region,</text>
<rect x="1215.0" y="600.0" width="200" height="36" fill="#f2f7f8" /><text x="1315" y="629" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">a tusk</text>
<rect x="662.0" y="825.0" width="256" height="36" fill="#f2f7f8" /><text x="790" y="854" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">6A. Mouth on the</text>
<rect x="662.0" y="857.0" width="256" height="36" fill="#f2f7f8" /><text x="790" y="886" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">ventral surface,</text>
<rect x="638.0" y="889.0" width="304" height="36" fill="#f2f7f8" /><text x="790" y="918" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">underneath the head</text>
<rect x="1047.0" y="841.0" width="256" height="36" fill="#f2f7f8" /><text x="1175" y="870" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">6B. Mouth at the</text>
<rect x="1039.0" y="873.0" width="272" height="36" fill="#f2f7f8" /><text x="1175" y="902" text-anchor="middle" fill="#102f40" font-family="system-ui,Segoe UI,sans-serif" font-size="27">front of the head</text>
</svg>